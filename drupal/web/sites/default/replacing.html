<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="15">
<title>DruxtJS is being refreshed</title>
<style>
:root{
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#ffffff;--fg:#1f2937;--muted:rgba(31,41,55,.62);
  --track:rgba(31,41,55,.10);--ghost:rgba(83,176,235,.32);--shimmer:rgba(255,255,255,.70);--ink:#2F495E;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e161e;--fg:#e4ecf2;--muted:rgba(228,236,242,.62);
  --track:rgba(228,236,242,.12);--ghost:rgba(83,176,235,.28);--shimmer:rgba(255,255,255,.30);--ink:#E5ECF1;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:48px 64px;background:var(--bg);color:var(--fg);font-family:var(--sans)}
main{width:100%;max-width:560px;display:flex;flex-direction:column;gap:30px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{height:54px;width:auto;display:block;flex:none}
.brand svg path:nth-child(1){animation:breathe 2.4s ease-in-out infinite alternate}
.brand svg path:nth-child(2){animation:breathe 2.4s ease-in-out .25s infinite alternate}
.brand svg path:nth-child(3){animation:breathe 2.4s ease-in-out .5s infinite alternate}
.word{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.words{display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
p{margin:0;font-size:15px;line-height:1.55;color:var(--muted);max-width:38ch}
.bar{position:relative;width:100%;max-width:360px;height:6px;border-radius:3px;background:var(--ghost);overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--shimmer),transparent);
  animation:sweep 1.5s cubic-bezier(.4,0,.6,1) infinite}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
@media (max-width:520px){
  body{padding:32px 24px}main{gap:24px}.brand{gap:12px}.brand svg{height:40px}
  .word{font-size:27px}h1{font-size:17px}p{font-size:14px}.meta{font-size:12px}.bar{max-width:none}
}
@media (prefers-reduced-motion:reduce){.brand svg path,.bar::after{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 452 342" role="img" aria-label="DruxtJS">
      <path fill="#3498DB" d="M139 330l-1-2c-2-4-2-8-1-13H29L189 31l67 121 22-16-67-121c-1-2-9-14-22-14-6 0-15 2-22 15L5 303c-1 3-8 16-2 27 4 6 10 12 24 12h136c-14 0-21-6-24-12z"/>
      <path fill="#108775" d="M447 304L317 70c-2-2-9-15-22-15-6 0-15 3-22 15l-17 28v54l39-67 129 230h-49a23 23 0 0 1-2 14l-1 1c-6 11-21 12-23 12h76c3 0 17-1 24-12 3-5 5-14-2-26z"/>
      <path fill="var(--ink)" d="M376 330v-1l1-2c1-4 2-8 1-12l-4-12-102-178-15-27h-1l-15 27-102 178-4 12a24 24 0 0 0 2 15c4 6 10 12 24 12h190c3 0 18-1 25-12zM256 152l93 163H163l93-163z"/>
    </svg>
    <span class="word">druxt.js</span>
  </div>
  <div class="words">
    <h1>Refreshing the content</h1>
    <p>The database is being replaced with a fresh copy. This page tries again on its own in a moment.</p>
  </div>
  <div class="bar" role="progressbar" aria-label="Refreshing the content"></div>
  <div class="meta">back shortly</div>
</main>
</body>
</html>
