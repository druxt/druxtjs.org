'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Quickstart command
description: The command that starts a new Druxt site, with a copy button and a panel for the starter kit and the way to run it.
group: druxtjs.org
props:
  type: object
  properties:
    commands:
      type: array
      title: Commands
      description: 'One per line, as "Label | command". The first is shown until a reader picks another. {repo} stands for the chosen starter kit.'
      items:
        type: string
      examples:
        - - 'giget | npx giget@1 gh:druxt/{repo}#develop my-druxt-site --install'
          - 'DevPod | devpod up github.com/druxt/{repo}'
    starter_kits:
      type: array
      title: Starter kits
      description: 'One per line, as "repository | Title | Description", the repository being its name under github.com/druxt. With one starter kit, the reader is not asked to choose.'
      items:
        type: string
      examples:
        - - 'quickstart | Druxt Quickstart | Drupal 11, Nuxt 2 and Druxt in one repository.'
