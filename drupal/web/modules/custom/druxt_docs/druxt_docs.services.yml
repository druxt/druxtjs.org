services:
  druxt_docs.frontend_redirect:
    class: Drupal\druxt_docs\EventSubscriber\FrontendRedirectSubscriber
    arguments: ['@current_user', '@path_alias.manager']
    tags:
      - { name: event_subscriber }
  druxt_docs.redirect_in_workspace_override:
    class: Drupal\druxt_docs\Config\RedirectInWorkspaceOverride
    arguments: ['@service_container']
    tags:
      - { name: config.factory.override }
