---
docker-compose-yaml: docker-compose.yml

environment_variables:
  git_sha: 'true'

routes:
  autogenerate:
    insecure: Redirect

# Production's own hosts. The package subdomains answer with a redirect to
# the site; the frontend's server does that.
environments:
  main:
    routes:
      - nuxt:
          - druxtjs.org
          - www.druxtjs.org
          - blocks.druxtjs.org
          - breadcrumb.druxtjs.org
          - entity.druxtjs.org
          - menu.druxtjs.org
          - router.druxtjs.org
          - schema.druxtjs.org
          - site.druxtjs.org
          - views.druxtjs.org
      - storybook:
          - storybook.druxtjs.org
      - nginx:
          - cms.druxtjs.org

tasks:
  post-rollout:
    - run:
        name: Install or update Drupal, and seed a new site's documentation
        command: sh /app/lagoon/post-rollout.sh
        service: cli
        shell: sh
