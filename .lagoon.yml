---
docker-compose-yaml: docker-compose.yml

environment_variables:
  git_sha: 'true'

routes:
  autogenerate:
    insecure: Redirect

# The database is the documentation's only copy: nothing exports it back to
# this repository. These are the platform's own defaults except for `monthly`,
# which defaults to 0, so a fault found more than six weeks late would have
# had nothing left to restore from.
backup-retention:
  production:
    monthly: 6
    weekly: 6
    daily: 7
    hourly: 0

backup-schedule:
  production: 'M H(22-2) * * *'

# Production's own hosts. The package subdomains answer with a redirect to
# the site; the frontend's server does that.
environments:
  main:
    # Production answers on its own hosts only. Every service here has a
    # custom route, so the autogenerated `*.amazee.io` ones reach the same
    # site under a host no reader should find: they have to be excluded
    # from search engines, they are what a misconfigured redirect sends
    # people to, and they make "which origin is this?" a question the code
    # has to keep answering. Other environments keep theirs, which is all
    # they have.
    autogenerateRoutes: false
    routes:
      - nuxt:
          - druxtjs.org
          - www.druxtjs.org
          - blocks.druxtjs.org
          - breadcrumb.druxtjs.org
          - entity.druxtjs.org
          - menu.druxtjs.org
          - router.druxtjs.org
          - schema.druxtjs.org
          - site.druxtjs.org
          - views.druxtjs.org
      - storybook:
          - storybook.druxtjs.org
      - nginx:
          - cms.druxtjs.org
    # One dump a night for the other environments to start from, so a
    # rollout copies a file instead of asking the live database for a full
    # mysqldump of itself. Scheduled after the backup window so the two are
    # not reading the database at once.
    cronjobs:
      - name: Dump the database for the other environments
        schedule: 'M 3 * * *'
        command: sh /app/lagoon/dump-for-environments.sh
        service: cli

tasks:
  post-rollout:
    - run:
        name: Install or update Drupal, and seed a new site's documentation
        command: sh /app/lagoon/post-rollout.sh
        service: cli
        shell: sh
